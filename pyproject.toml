[build-system]
requires = ["setuptools==82.0.1", "setuptools-scm==9.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ase-calculator-kit"
description = "Unified ASE calculator factory for MLIP and DFT calculators."
readme = "README.md"
# No upper bound: an upper cap is baked into every uploaded file and makes the
# package invisible to a newer interpreter even when it works there. Individual
# backends that lag behind cap themselves — fairchem-core declares <3.14 — and
# pip then names the backend in the error instead of hiding this package.
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Taishiro Wakamiya" }, { name = "Atsushi Ishikawa" }]
keywords = ["ase", "calculator", "dft", "machine-learning", "interatomic-potential", "mlip", "chemistry", "materials"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

# Published metadata uses compatible ranges so this library can coexist with
# whatever ASE / NNP versions are already in a user's environment. The exact
# known-good versions live in constraints.txt for CI and local reproducibility.
dependencies = [
    "ase>=3.28,<4",
    "pyyaml>=6.0,<7",
]

# The version is derived from the git tag by setuptools-scm rather than written
# here. It used to live in three places that had to agree, and once did not:
# 0.3.3 shipped a CITATION.cff still announcing 0.3.2. The tag is now the single
# source of truth, so building an untagged commit yields a .devN version and a
# release cannot disagree with its own tag.
dynamic = ["version"]

[project.optional-dependencies]
chgnet = ["chgnet>=0.4,<0.5"]
sevennet = ["sevenn>=0.13"]
mattersim = ["mattersim>=1.2,<2"]
nequip = ["nequip>=0.18,<0.19"]
uma = ["fairchem-core>=2.20,<3"]
dispersion = ["torch-dftd>=0.5,<0.6"]
all = [
    "chgnet>=0.4,<0.5",
    "sevenn>=0.13",
    "mattersim>=1.2,<2",
    "nequip>=0.18,<0.19",
    "fairchem-core>=2.20,<3",
    "torch-dftd>=0.5,<0.6",
]
# Development tooling is not a library dependency, so it stays exactly pinned:
# a ruff bump must not turn CI red on an unrelated pull request.
dev = ["pytest==9.0.3", "ruff==0.15.15", "tqdm==4.67.3"]

[project.urls]
Homepage = "https://github.com/ishikawa-group/ase-calculator-kit"
Repository = "https://github.com/ishikawa-group/ase-calculator-kit"
Changelog = "https://github.com/ishikawa-group/ase-calculator-kit/blob/main/CHANGELOG.md"
Issues = "https://github.com/ishikawa-group/ase-calculator-kit/issues"

[tool.setuptools_scm]
# `git describe` output alone; no local-version (+g<sha>) segment, because PyPI
# rejects local versions on upload.
local_scheme = "no-local-version"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ase_calculator_kit = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: real single-point calculations that download model weights",
]
