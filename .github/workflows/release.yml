name: Release

# Publishing a GitHub Release is the single act that cuts a release: it uploads
# to PyPI, and it is also the event the Zenodo webhook listens for, so the
# package and its DOI can no longer come from different commits. 0.3.3 lost its
# DOI exactly that way — the tag was pushed before Zenodo was wired up, and the
# upload was a separate manual step.
#
# A manual run is always a TestPyPI dry run; there is no way to reach PyPI from
# this workflow except by publishing a release.
#
# Uploads use PyPI Trusted Publishing (OIDC) — no API token is stored here.
# One-time setup on https://pypi.org/manage/account/publishing/:
#   owner: ishikawa-group   repository: ase-calculator-kit
#   workflow: release.yml   environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Nothing is built, let alone uploaded, until the suite passes.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the published release from its tag: setuptools-scm reads the
          # version out of `git describe`, so a shallow or detached checkout
          # would produce a .devN version instead of the released one.
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Show what will be uploaded
        run: ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
      url: ${{ github.event_name == 'release' && 'https://pypi.org/p/ase-calculator-kit' || 'https://test.pypi.org/p/ase-calculator-kit' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event_name == 'release' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          # A re-run after a partly-failed upload should be a no-op, not an error.
          skip-existing: true
