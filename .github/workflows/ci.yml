name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (default deps only)
        # Pulls SevenNet (a base dependency since 0.3.1) and its torch stack.
        # The other NNP backends stay optional; the fast suite mocks them.
        # constraints.txt pins the exact tested versions behind pyproject ranges.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' -c constraints.txt

      - name: Run fast tests
        run: pytest

      - name: Lint
        run: ruff check src tests examples
